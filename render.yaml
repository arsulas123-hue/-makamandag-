services:
  - type: web
    name: makamandag-app
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --worker-class gevent --workers 1 --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: makamandag-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Set these manually in the Render dashboard after first deploy:
      - key: GEMINI_API_KEY
        value: ""          # paste your key in the Render dashboard
      - key: OPENROUTER_API_KEY
        value: ""          # paste your key in the Render dashboard

databases:
  - name: makamandag-db
    plan: free
