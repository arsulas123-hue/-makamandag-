<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSpend - Database Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0f1a 0%, #0f1622 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e2eff8;
        }
        .container {
            background: rgba(21, 30, 45, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            width: 500px;
            max-width: 90%;
            border: 1px solid rgba(0, 210, 130, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #fff, #00d282);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        h2 {
            font-size: 1.1rem;
            margin: 20px 0 12px 0;
            color: #00d282;
            border-bottom: 1px solid rgba(0,210,130,0.2);
            padding-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 12px;
            background: #0a1525;
            border: 1px solid #2a3a4a;
            border-radius: 12px;
            color: white;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #00d282;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d282, #009e5f);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 210, 130, 0.3);
        }
        .result {
            background: #0a1525;
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid #2a3a4a;
        }
        .success { color: #00d282; }
        .error { color: #ff4d6d; }
        .info { color: #f0a500; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .status-ok { background: rgba(0,210,130,0.2); color: #00d282; }
        .status-fail { background: rgba(255,77,109,0.2); color: #ff4d6d; }
        hr { border-color: #2a3a4a; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 SmartSpend Database Test</h1>
        
        <!-- Health Check -->
        <div>
            <h2>📡 Server Health <span id="healthBadge" class="status-badge">Testing...</span></h2>
            <div id="healthResult" class="result">Checking...</div>
        </div>

        <!-- Registration Form -->
        <h2>📝 Register New User</h2>
        <input type="text" id="regName" placeholder="Full Name" value="TestUser">
        <input type="email" id="regEmail" placeholder="Email" value="test_">
        <input type="password" id="regPassword" placeholder="Password (min 8 chars)" value="password123">
        <label><input type="checkbox" id="termsCheck"> Accept Terms</label>
        <button id="registerBtn">Register</button>

        <!-- Login Form -->
        <h2>🔐 Login</h2>
        <input type="email" id="loginEmail" placeholder="Email" value="admin@smartspend.com">
        <input type="password" id="loginPassword" placeholder="Password" value="admin123">
        <button id="loginBtn">Login</button>

        <!-- Check Session -->
        <h2>👤 Current Session</h2>
        <button id="checkSessionBtn">Check Who's Logged In</button>
        
        <!-- Logout -->
        <h2>🚪 Logout</h2>
        <button id="logoutBtn">Logout</button>

        <!-- Result Display -->
        <div class="result" id="resultDisplay">
            Click any button to see the result...
        </div>
    </div>

    <script>
        const resultDiv = document.getElementById('resultDisplay');
        
        function showResult(data, isError = false) {
            resultDiv.innerHTML = `<span class="${isError ? 'error' : 'success'}">${isError ? '❌ Error' : '✅ Success'}</span><br><br>` + JSON.stringify(data, null, 2);
            resultDiv.style.borderColor = isError ? '#ff4d6d' : '#00d282';
        }

        function showError(error) {
            resultDiv.innerHTML = `<span class="error">❌ Error: ${error}</span>`;
            resultDiv.style.borderColor = '#ff4d6d';
        }

        // Health Check
        async function checkHealth() {
            const healthResult = document.getElementById('healthResult');
            const badge = document.getElementById('healthBadge');
            try {
                const res = await fetch('/api/health', { credentials: 'include' });
                const data = await res.json();
                healthResult.innerHTML = JSON.stringify(data, null, 2);
                badge.innerHTML = '✓ Online';
                badge.className = 'status-badge status-ok';
                healthResult.style.borderColor = '#00d282';
            } catch (err) {
                healthResult.innerHTML = `Failed to connect: ${err.message}`;
                badge.innerHTML = '✗ Offline';
                badge.className = 'status-badge status-fail';
                healthResult.style.borderColor = '#ff4d6d';
            }
        }

        // Register
        async function register() {
            const name = document.getElementById('regName').value;
            let email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const terms = document.getElementById('termsCheck').checked;
            
            if (!name || !email || !password) {
                showError('Please fill all fields');
                return;
            }
            if (password.length < 8) {
                showError('Password must be at least 8 characters');
                return;
            }
            if (!terms) {
                showError('Please accept terms');
                return;
            }
            
            // Add timestamp to email for uniqueness
            if (email === 'test_' || email === 'test_@example.com') {
                email = 'test_' + Date.now() + '@example.com';
                document.getElementById('regEmail').value = email;
            }
            
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, accepted_terms: true }),
                    credentials: 'include'
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                showResult({ message: 'User created!', email: email, ...data });
                // Auto-fill login form
                document.getElementById('loginEmail').value = email;
                document.getElementById('loginPassword').value = password;
            } catch (err) {
                showError(err.message);
            }
        }

        // Login
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showError('Email and password required');
                return;
            }
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include'
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                showResult({ message: 'Login successful!', user: data.user });
            } catch (err) {
                showError(err.message);
            }
        }

        // Check Session
        async function checkSession() {
            try {
                const res = await fetch('/api/me', { credentials: 'include' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Not logged in');
                showResult({ loggedIn: true, user: data });
            } catch (err) {
                showResult({ loggedIn: false, message: err.message }, true);
            }
        }

        // Logout
        async function logout() {
            try {
                const res = await fetch('/api/logout', { 
                    method: 'POST', 
                    credentials: 'include' 
                });
                const data = await res.json();
                showResult({ message: 'Logged out successfully', ...data });
                // Clear login fields
                document.getElementById('loginEmail').value = 'admin@smartspend.com';
                document.getElementById('loginPassword').value = 'admin123';
            } catch (err) {
                showError(err.message);
            }
        }

        // Auto-generate unique email on page load
        function setRandomEmail() {
            const emailInput = document.getElementById('regEmail');
            emailInput.value = 'test_' + Date.now() + '@example.com';
        }

        // Attach event listeners
        document.getElementById('registerBtn').onclick = register;
        document.getElementById('loginBtn').onclick = login;
        document.getElementById('checkSessionBtn').onclick = checkSession;
        document.getElementById('logoutBtn').onclick = logout;
        
        // Run health check on load
        checkHealth();
        setRandomEmail();
        
        // Also check session on load
        setTimeout(checkSession, 500);
    </script>
</body>
</html>
