<!DOCTYPE html>
<html>
<head><title>Auth Test</title></head>
<body>
  <h2>Register Test</h2>
  <input id="name" placeholder="Name"><br>
  <input id="email" placeholder="Email"><br>
  <input id="pass" type="password" placeholder="Password"><br>
  <label><input id="terms" type="checkbox"> Accept Terms</label><br>
  <button onclick="register()">Register</button>
  <button onclick="login()">Login (admin@smartspend.com / admin123)</button>
  <pre id="result"></pre>

  <script>
    async function register() {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('pass').value,
          accepted_terms: document.getElementById('terms').checked
        }),
        credentials: 'include'
      });
      const data = await res.json();
      document.getElementById('result').innerText = JSON.stringify(data, null, 2);
    }
    async function login() {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          email: 'admin@smartspend.com',
          password: 'admin123'
        }),
        credentials: 'include'
      });
      const data = await res.json();
      document.getElementById('result').innerText = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
