<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SmartSpend — AI-Powered Personal Finance</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0f1a; --bg2: #0f1622; --bg3: #151e2d;
            --panel: rgba(21, 30, 45, 0.9); --border: rgba(0, 210, 130, 0.2);
            --border2: rgba(255, 255, 255, 0.05); --green: #00d282; --green2: #00ff9d;
            --green-dim: rgba(0, 210, 130, 0.15); --red: #ff4d6d; --red-dim: rgba(255, 77, 109, 0.15);
            --amber: #f0a500; --muted: #6c86a0; --text: #e2eff8;
            --mono: 'JetBrains Mono', monospace; --sans: 'Space Grotesk', sans-serif; --r: 16px;
        }
        body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }
        
        /* Sidebar */
        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 80px; background: rgba(15, 22, 34, 0.98); backdrop-filter: blur(12px); border-right: 1px solid var(--border2); display: flex; flex-direction: column; align-items: center; padding: 24px 0; gap: 10px; z-index: 100; transition: width 0.3s; }
        .sidebar:hover { width: 240px; }
        .sidebar-logo { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, var(--green), #009e5f); display: flex; align-items: center; justify-content: center; margin-bottom: 28px; cursor: pointer; }
        .nav-item { width: 100%; display: flex; align-items: center; gap: 16px; padding: 12px 24px; border-radius: 12px; cursor: pointer; border: none; background: transparent; color: var(--muted); font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; transition: all 0.2s; }
        .nav-item:hover { background: var(--green-dim); color: var(--text); transform: translateX(6px); }
        .nav-item.active { background: var(--green-dim); color: var(--green); border-left: 3px solid var(--green); }
        .nav-label { opacity: 0; transition: opacity 0.2s; }
        .sidebar:hover .nav-label { opacity: 1; }
        .sidebar-bottom { margin-top: auto; width: 100%; }
        .main { margin-left: 80px; padding: 24px 32px; min-height: 100vh; }
        @media (max-width: 768px) { .sidebar { width: 70px; } .main { margin-left: 70px; padding: 20px; } }
        @media (max-width: 600px) { .sidebar { display: none; } .main { margin-left: 0; } }
        
        /* Top Bar */
        .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 16px; }
        .topbar h1 { font-size: 1.75rem; font-weight: 700; background: linear-gradient(135deg, #fff, var(--green)); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .score-pill { display: flex; align-items: center; gap: 10px; padding: 8px 20px; border-radius: 99px; background: var(--green-dim); border: 1px solid var(--border); font-size: 0.85rem; font-weight: 600; color: var(--green); }
        .score-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }
        .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #a855f7); display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; }
        .signout-btn { background: var(--red-dim); border: 1px solid rgba(255, 77, 109, 0.2); color: #ff4d6d; padding: 8px 18px; border-radius: 10px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
        .signout-btn:hover { background: rgba(255, 77, 109, 0.2); transform: translateY(-2px); }
        
        /* Screens */
        .screen { display: none; animation: fadeUp 0.35s ease; }
        .screen.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 28px; }
        .stat-card { background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--border2); border-radius: var(--r); padding: 22px; transition: all 0.25s; }
        .stat-card:hover { transform: translateY(-4px); border-color: var(--border); }
        .stat-value { font-size: 1.8rem; font-weight: 700; font-family: var(--mono); }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-top: 8px; }
        .stat-card.green .stat-value { color: var(--green); }
        .stat-card.red .stat-value { color: #ff4d6d; }
        .stat-card.blue .stat-value { color: #3b82f6; }
        .stat-card.amber .stat-value { color: #f0a500; }
        
        /* Panels */
        .panel { background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--border2); border-radius: var(--r); padding: 22px; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; margin-bottom: 28px; }
        canvas { max-height: 260px; width: 100% !important; }
        
        /* Forms */
        input, select, .btn { background: var(--bg3); color: var(--text); border: 1px solid var(--border2); border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; outline: none; }
        input:focus, select:focus { border-color: var(--green); }
        .btn-green { background: linear-gradient(135deg, var(--green), #009e5f); color: #000; border: none; cursor: pointer; font-weight: 600; }
        .btn-green:hover { transform: translateY(-2px); }
        
        /* Table */
        .table-wrap { overflow-x: auto; border-radius: var(--r); background: var(--panel); border: 1px solid var(--border2); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border2); }
        .advice-item { padding: 14px; border-radius: 12px; margin-bottom: 10px; background: var(--bg3); }
        .advice-item strong { color: var(--green); }
        
        /* Toast */
        #toast { position: fixed; bottom: 24px; right: 24px; background: var(--bg2); border: 1px solid var(--green); border-radius: 12px; padding: 12px 24px; opacity: 0; transition: 0.25s; z-index: 10000; }
        #toast.show { opacity: 1; }
        
        /* Auth Overlay */
        #authOverlay { position: fixed; inset: 0; background: rgba(8,13,20,0.98); backdrop-filter: blur(20px); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: linear-gradient(145deg, #0d1520, #0a1220); border: 1px solid rgba(0,210,130,0.2); border-radius: 28px; padding: 40px; width: 400px; max-width: 90%; }
        .auth-card h2 { text-align: center; margin-bottom: 24px; background: linear-gradient(135deg, #fff, #00d282); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .auth-input { width: 100%; padding: 12px 16px; margin-bottom: 14px; background: #0a1525; border: 1px solid #2a3a4a; border-radius: 12px; color: white; }
        .auth-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #00d282, #009e5f); border: none; border-radius: 12px; color: #000; font-weight: 700; cursor: pointer; }
        .auth-link { cursor: pointer; text-align: center; margin-top: 16px; color: #6c86a0; }
        
        /* Chatbot */
        .chat-container { position: fixed; bottom: 24px; right: 24px; z-index: 10001; cursor: move; }
        .chat-window { width: 360px; height: 480px; background: var(--bg2); backdrop-filter: blur(10px); border: 1px solid var(--green); border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { padding: 14px 18px; background: var(--bg3); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; cursor: move; }
        .chat-header span { font-weight: 600; color: var(--green); }
        .chat-header button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 0.85rem; }
        .user-message { align-self: flex-end; background: var(--green-dim); color: var(--green); }
        .bot-message { align-self: flex-start; background: var(--bg3); color: var(--text); }
        .chat-input { display: flex; padding: 14px; gap: 10px; background: var(--bg3); border-top: 1px solid var(--border); }
        .chat-input input { flex: 1; background: var(--bg2); border-radius: 20px; padding: 8px 14px; border: 1px solid var(--border2); }
        .chat-input button { background: var(--green); border: none; border-radius: 20px; padding: 8px 18px; color: #000; font-weight: 600; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<nav class="sidebar">
    <div class="sidebar-logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></div>
    <button class="nav-item" data-nav="dashboard"><span class="nav-label">Dashboard</span></button>
    <button class="nav-item" data-nav="add"><span class="nav-label">Add Transaction</span></button>
    <button class="nav-item" data-nav="analytics"><span class="nav-label">Analytics</span></button>
    <button class="nav-item" data-nav="budgets"><span class="nav-label">Budgets</span></button>
    <button class="nav-item" data-nav="transactions"><span class="nav-label">History</span></button>
    <div class="sidebar-bottom"><button class="nav-item" onclick="exportPDF()"><span class="nav-label">Export PDF</span></button></div>
</nav>

<main class="main">
    <div class="topbar">
        <div><h1 id="pageTitle">Dashboard</h1></div>
        <div class="topbar-right">
            <div class="score-pill"><div class="score-dot"></div><span>Health: <strong id="topScore">—</strong></span></div>
            <div class="avatar" id="userAvatar">US</div>
            <button class="signout-btn" id="signoutBtn">Sign Out</button>
        </div>
    </div>
    <div id="toast"></div>

    <!-- Dashboard Screen -->
    <div class="screen active" id="screen-dashboard">
        <div class="stats-grid">
            <div class="stat-card green"><div class="stat-value" id="sBalance">—</div><div class="stat-label">Balance</div></div>
            <div class="stat-card red"><div class="stat-value" id="sExpense">—</div><div class="stat-label">Expenses</div></div>
            <div class="stat-card blue"><div class="stat-value" id="sIncome">—</div><div class="stat-label">Income</div></div>
            <div class="stat-card amber"><div class="stat-value" id="sScore">—</div><div class="stat-label">ML Score</div></div>
        </div>
        <div class="chart-grid">
            <div class="panel"><canvas id="monthlyChart" height="200"></canvas></div>
            <div class="panel"><canvas id="donutChart" height="200"></canvas></div>
        </div>
        <div class="panel"><div id="adviceList"></div></div>
    </div>

    <!-- Add Transaction Screen -->
    <div class="screen" id="screen-add">
        <div class="stats-grid" style="grid-template-columns: 1fr 1fr">
            <div class="panel">
                <div style="display: flex; gap: 12px; margin-bottom: 20px;">
                    <button id="btnExp" style="flex:1; background: rgba(255,77,109,0.15); color: #ff4d6d; padding: 10px; border: none; border-radius: 10px; cursor: pointer;">Expense</button>
                    <button id="btnInc" style="flex:1; background: rgba(0,210,130,0.15); color: #00d282; padding: 10px; border: none; border-radius: 10px; cursor: pointer;">Income</button>
                </div>
                <form id="txForm">
                    <input type="number" id="txAmount" placeholder="Amount (₱)" required style="width:100%; margin-bottom:12px">
                    <select id="txCategory" style="width:100%; margin-bottom:12px">
                        <option>Food & Dining</option><option>Transport</option><option>Groceries</option>
                        <option>Entertainment</option><option>Health</option><option>Salary</option>
                    </select>
                    <input type="text" id="txNote" placeholder="Note" style="width:100%; margin-bottom:12px">
                    <input type="hidden" id="txType" value="expense">
                    <button type="submit" class="btn-green" style="width:100%">Save Transaction</button>
                </form>
            </div>
            <div class="panel"><div id="recentList"></div></div>
        </div>
    </div>

    <!-- Analytics Screen -->
    <div class="screen" id="screen-analytics">
        <div class="chart-grid">
            <div class="panel"><canvas id="forecastChart" height="200"></canvas></div>
            <div class="panel"><canvas id="catBarChart" height="200"></canvas></div>
        </div>
        <div class="panel"><div id="fullAdvice"></div></div>
    </div>

    <!-- Budgets Screen -->
    <div class="screen" id="screen-budgets">
        <div class="panel">
            <div class="panel-header"><div class="panel-title">Monthly Budgets</div><button class="btn-green" id="saveBudgetsBtn">Save All</button></div>
            <div id="budgetInputs" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;"></div>
        </div>
    </div>

    <!-- Transactions Screen -->
    <div class="screen" id="screen-transactions">
        <div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Note</th><th>Type</th><th>Amount</th></table></thead><tbody id="txTableBody"></tbody></table></div>
    </div>

    <!-- Auth Overlay -->
    <div id="authOverlay">
        <div class="auth-card">
            <h2 id="authTitle">Welcome back</h2>
            <input type="text" id="regName" class="auth-input" placeholder="Full Name" style="display:none">
            <input type="email" id="authEmail" class="auth-input" placeholder="Email">
            <input type="password" id="authPass" class="auth-input" placeholder="Password">
            <input type="password" id="authConfirm" class="auth-input" placeholder="Confirm Password" style="display:none">
            <div id="termsRow" style="display:none; margin-bottom:14px;"><label><input type="checkbox" id="termsCheck"> Accept Terms</label></div>
            <div id="authMsg" style="color:#ff4d6d; font-size:0.8rem; margin-bottom:12px;"></div>
            <button id="authBtn" class="auth-btn">Sign In</button>
            <div id="toggleAuthLink" class="auth-link">Don't have an account? Register</div>
        </div>
    </div>

    <!-- Chatbot -->
    <div id="chatContainer" class="chat-container">
        <div class="chat-window">
            <div class="chat-header" id="chatHeader"><span>🤖 SmartSpend AI</span><button id="closeChatBtn">✕</button></div>
            <div class="chat-messages" id="chatMessages"><div class="message bot-message">Hi! Ask me about saving money or budget tips!</div></div>
            <div class="chat-input"><input id="chatInput" placeholder="Ask something..."><button id="sendChatBtn">Send</button></div>
        </div>
    </div>
</main>

<script>
// ========== GLOBAL STATE ==========
let currentUser = null;
let allTransactions = [];
let currentSummary = { balance: 0, expense: 0, income: 0 };
let currentPrediction = { score: 0, predictions: { weekly: {}, categories: {} }, advice: [] };
let monthlyChart, donutChart, forecastChart, catBarChart;
let isLogin = true;

// ========== UTILITIES ==========
function fmt(amt) { return '₱' + Number(amt).toLocaleString('en-PH', { minimumFractionDigits: 2 }); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

async function apiFetch(url, opts = {}) {
    const res = await fetch(url, { ...opts, credentials: 'include', headers: { 'Content-Type': 'application/json' } });
    if (!res.ok) { const err = await res.json(); throw new Error(err.error || 'Request failed'); }
    return res.json();
}

// ========== AUTHENTICATION ==========
function toggleAuthMode() {
    isLogin = !isLogin;
    document.getElementById('authTitle').innerText = isLogin ? 'Welcome back' : 'Create Account';
    document.getElementById('regName').style.display = isLogin ? 'none' : 'block';
    document.getElementById('authConfirm').style.display = isLogin ? 'none' : 'block';
    document.getElementById('termsRow').style.display = isLogin ? 'none' : 'flex';
    document.getElementById('authBtn').innerText = isLogin ? 'Sign In' : 'Create Account';
    document.getElementById('toggleAuthLink').innerHTML = isLogin ? "Don't have an account? Register" : "Already have an account? Sign In";
    document.getElementById('authMsg').innerHTML = '';
}

async function handleAuth() {
    const email = document.getElementById('authEmail').value;
    const pass = document.getElementById('authPass').value;
    const msgDiv = document.getElementById('authMsg');
    if (!email || !pass) { msgDiv.innerText = 'Email and password required'; return; }

    if (!isLogin) {
        const name = document.getElementById('regName').value;
        const confirm = document.getElementById('authConfirm').value;
        const terms = document.getElementById('termsCheck').checked;
        if (!name) { msgDiv.innerText = 'Full name required'; return; }
        if (pass !== confirm) { msgDiv.innerText = 'Passwords do not match'; return; }
        if (!terms) { msgDiv.innerText = 'Accept terms'; return; }
        if (pass.length < 8) { msgDiv.innerText = 'Password must be at least 8 characters'; return; }
        try {
            const res = await fetch('/api/register', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password: pass, accepted_terms: true }),
                credentials: 'include'
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);
            msgDiv.style.color = '#00d282';
            msgDiv.innerText = 'Account created! Please login.';
            setTimeout(() => toggleAuthMode(), 1500);
        } catch (e) { msgDiv.innerText = e.message; }
        return;
    }

    try {
        const res = await fetch('/api/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password: pass }),
            credentials: 'include'
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        currentUser = data.user;
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('userAvatar').innerText = currentUser.name.slice(0, 2).toUpperCase();
        await loadDashboard();
        nav('dashboard');
    } catch (e) { msgDiv.innerText = e.message; }
}

async function logout() {
    await fetch('/api/logout', { method: 'POST', credentials: 'include' });
    currentUser = null;
    document.getElementById('authOverlay').style.display = 'flex';
    document.getElementById('userAvatar').innerText = 'US';
}

// ========== NAVIGATION ==========
function nav(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(`screen-${screenId}`).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
    const activeBtn = Array.from(document.querySelectorAll('.nav-item')).find(btn => btn.getAttribute('data-nav') === screenId);
    if (activeBtn) activeBtn.classList.add('active');
    const titles = { dashboard: 'Dashboard', add: 'Add Transaction', analytics: 'Analytics', budgets: 'Budgets', transactions: 'History' };
    document.getElementById('pageTitle').innerText = titles[screenId] || 'SmartSpend';
    if (screenId === 'analytics') loadAnalytics();
    if (screenId === 'budgets') loadBudgets();
    if (screenId === 'transactions') renderTransactions();
}

// ========== DASHBOARD ==========
async function loadDashboard() {
    if (!currentUser) return;
    try {
        const summary = await apiFetch(`/api/summary/${currentUser.id}`);
        const pred = await apiFetch(`/api/predict/${currentUser.id}`);
        allTransactions = await apiFetch(`/api/transactions?user_id=${currentUser.id}`);
        currentSummary = summary;
        currentPrediction = pred;
        
        document.getElementById('sBalance').innerText = fmt(summary.balance);
        document.getElementById('sExpense').innerText = fmt(summary.expense);
        document.getElementById('sIncome').innerText = fmt(summary.income);
        document.getElementById('sScore').innerText = pred.score + '/100';
        document.getElementById('topScore').innerText = pred.score;
        
        if (monthlyChart) monthlyChart.destroy();
        const months = Object.keys(summary.monthly).slice(-6);
        monthlyChart = new Chart(document.getElementById('monthlyChart'), { 
            type: 'bar', data: { labels: months, datasets: [{ label: 'Income', data: months.map(m => summary.monthly[m]?.income || 0), backgroundColor: 'rgba(0,210,130,0.6)' }, { label: 'Expense', data: months.map(m => summary.monthly[m]?.expense || 0), backgroundColor: 'rgba(255,77,109,0.6)' }] }
        });
        
        if (donutChart) donutChart.destroy();
        donutChart = new Chart(document.getElementById('donutChart'), { type: 'doughnut', data: { labels: Object.keys(pred.predictions.categories), datasets: [{ data: Object.values(pred.predictions.categories), backgroundColor: ['#00d282', '#3b82f6', '#f0a500', '#a855f7', '#ff4d6d'] }] }, options: { cutout: '65%' } });
        
        document.getElementById('adviceList').innerHTML = pred.advice.map(a => `<div class="advice-item"><strong>${a.cat}</strong>: ${a.msg}</div>`).join('');
        document.getElementById('recentList').innerHTML = allTransactions.slice(0, 5).map(t => `<div style="padding:10px 0; border-bottom:1px solid var(--border2);"><strong>${t.category}</strong><br>${fmt(t.amount)}<br><small>${new Date(t.tx_date).toLocaleDateString()}</small></div>`).join('');
        renderTransactions();
        loadAnalytics();
    } catch (e) { console.error(e); toast('Error loading data'); }
}

async function renderTransactions() {
    if (!currentUser) return;
    document.getElementById('txTableBody').innerHTML = allTransactions.slice(0, 50).map(t => `
        <tr>
            <td>${new Date(t.tx_date).toLocaleDateString()}</td>
            <td>${t.category}</td>
            <td>${t.note || '—'}</td>
            <td style="color: ${t.tx_type === 'income' ? '#00d282' : '#ff4d6d'}">${t.tx_type}</td>
            <td>${fmt(t.amount)}</td>
        </tr>
    `).join('');
}

async function loadAnalytics() {
    if (!currentUser) return;
    const pred = currentPrediction;
    if (forecastChart) forecastChart.destroy();
    forecastChart = new Chart(document.getElementById('forecastChart'), { type: 'line', data: { labels: Object.keys(pred.predictions.weekly), datasets: [{ label: 'Forecast', data: Object.values(pred.predictions.weekly), borderColor: '#00d282', tension: 0.3 }] } });
    if (catBarChart) catBarChart.destroy();
    catBarChart = new Chart(document.getElementById('catBarChart'), { type: 'bar', data: { labels: Object.keys(pred.predictions.categories), datasets: [{ label: 'Spending', data: Object.values(pred.predictions.categories), backgroundColor: '#3b82f6' }] }, options: { indexAxis: 'y' } });
    document.getElementById('fullAdvice').innerHTML = pred.advice.map(a => `<div class="advice-item"><strong>${a.cat}</strong><br>${a.msg}</div>`).join('');
}

async function loadBudgets() {
    if (!currentUser) return;
    const budgets = await apiFetch(`/api/budgets/${currentUser.id}`);
    const limits = Object.fromEntries(budgets.map(b => [b.category, b.limit]));
    const categories = ['Food & Dining', 'Transport', 'Groceries', 'Entertainment', 'Health'];
    document.getElementById('budgetInputs').innerHTML = categories.map(cat => `<div><label>${cat}</label><input type="number" id="budget_${cat.replace(/\s/g, '')}" value="${limits[cat] || ''}" placeholder="Limit" style="width:100%"></div>`).join('');
    document.getElementById('saveBudgetsBtn').onclick = async () => {
        for (let cat of categories) {
            const val = parseFloat(document.getElementById(`budget_${cat.replace(/\s/g, '')}`).value);
            if (!isNaN(val) && val > 0) await apiFetch(`/api/budgets/${currentUser.id}`, { method: 'POST', body: JSON.stringify({ category: cat, limit: val }) });
        }
        toast('Budgets saved!');
        await loadDashboard();
    };
}

document.getElementById('sendChatBtn').onclick = () => {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg) return;
    const msgs = document.getElementById('chatMessages');
    msgs.innerHTML += `<div class="message user-message">${msg}</div>`;
    input.value = '';
    msgs.scrollTop = msgs.scrollHeight;
    let reply = `I can help with saving tips and budget advice.`;
    if (msg.toLowerCase().includes('save')) reply = `Try reducing ${Object.keys(currentPrediction.predictions.categories)[0] || 'dining out'} by 20% to save more.`;
    else if (msg.toLowerCase().includes('health')) reply = `Your financial health score is ${currentPrediction.score}/100.`;
    else if (msg.toLowerCase().includes('budget')) reply = currentPrediction.advice[0]?.msg || "Set budgets for each category!";
    setTimeout(() => {
        msgs.innerHTML += `<div class="message bot-message">${reply}</div>`;
        msgs.scrollTop = msgs.scrollHeight;
    }, 300);
};
document.getElementById('chatInput').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('sendChatBtn').click(); });
