<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSpend - Login Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0f1a 0%, #0f1622 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e2eff8;
        }
        .container {
            background: rgba(21, 30, 45, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            width: 400px;
            border: 1px solid rgba(0, 210, 130, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #fff, #00d282);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 12px;
            background: #0a1525;
            border: 1px solid #2a3a4a;
            border-radius: 12px;
            color: white;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #00d282;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d282, #009e5f);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 210, 130, 0.3);
        }
        .toggle-link {
            text-align: center;
            margin-top: 16px;
            color: #6c86a0;
            cursor: pointer;
        }
        .toggle-link:hover {
            color: #00d282;
        }
        .message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            text-align: center;
        }
        .error { background: rgba(255, 77, 109, 0.2); color: #ff4d6d; border: 1px solid rgba(255, 77, 109, 0.3); }
        .success { background: rgba(0, 210, 130, 0.2); color: #00d282; border: 1px solid rgba(0, 210, 130, 0.3); }
        .dashboard {
            display: none;
            text-align: center;
        }
        .dashboard h2 { margin-bottom: 20px; color: #00d282; }
        .info-card {
            background: rgba(21, 30, 45, 0.8);
            padding: 20px;
            border-radius: 12px;
            margin: 10px 0;
        }
        .logout-btn {
            background: rgba(255, 77, 109, 0.2);
            color: #ff4d6d;
            margin-top: 20px;
        }
        .logout-btn:hover {
            background: rgba(255, 77, 109, 0.3);
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Login Form -->
        <div id="authForm">
            <h1>💰 SmartSpend</h1>
            <div id="message"></div>
            <input type="text" id="nameField" placeholder="Full Name" style="display: none;">
            <input type="email" id="emailField" placeholder="Email" autocomplete="email">
            <input type="password" id="passwordField" placeholder="Password" autocomplete="current-password">
            <div id="termsDiv" style="display: none; margin-bottom: 12px;">
                <label><input type="checkbox" id="termsCheck"> I accept the Terms</label>
            </div>
            <button id="submitBtn">Sign In</button>
            <div class="toggle-link" id="toggleLink">Don't have an account? Register</div>
        </div>

        <!-- Dashboard (shown after login) -->
        <div id="dashboard" class="dashboard">
            <h1>💰 SmartSpend</h1>
            <h2>Welcome, <span id="userName">User</span>!</h2>
            <div class="info-card">
                <p>✅ You are successfully logged in!</p>
                <p style="margin-top: 10px; font-size: 14px; color: #6c86a0;">Your backend is working perfectly.</p>
            </div>
            <button class="logout-btn" id="logoutBtn">Sign Out</button>
        </div>
    </div>

    <script>
        let isLogin = true;
        let currentUser = null;

        const authForm = document.getElementById('authForm');
        const dashboard = document.getElementById('dashboard');
        const nameField = document.getElementById('nameField');
        const termsDiv = document.getElementById('termsDiv');
        const submitBtn = document.getElementById('submitBtn');
        const toggleLink = document.getElementById('toggleLink');
        const messageDiv = document.getElementById('message');

        function showMessage(text, isError = true) {
            messageDiv.innerHTML = `<div class="message ${isError ? 'error' : 'success'}">${text}</div>`;
            setTimeout(() => {
                if (messageDiv.innerHTML) messageDiv.innerHTML = '';
            }, 3000);
        }

        function toggleMode() {
            isLogin = !isLogin;
            nameField.style.display = isLogin ? 'none' : 'block';
            termsDiv.style.display = isLogin ? 'none' : 'flex';
            submitBtn.innerText = isLogin ? 'Sign In' : 'Create Account';
            toggleLink.innerText = isLogin ? "Don't have an account? Register" : "Already have an account? Sign In";
            messageDiv.innerHTML = '';
        }

        async function handleAuth() {
            const email = document.getElementById('emailField').value;
            const password = document.getElementById('passwordField').value;

            if (!email || !password) {
                showMessage('Email and password required');
                return;
            }

            if (!isLogin) {
                const name = document.getElementById('nameField').value;
                const terms = document.getElementById('termsCheck').checked;

                if (!name) {
                    showMessage('Full name required');
                    return;
                }
                if (password.length < 8) {
                    showMessage('Password must be at least 8 characters');
                    return;
                }
                if (!terms) {
                    showMessage('Please accept the Terms');
                    return;
                }

                try {
                    const res = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, password, accepted_terms: true }),
                        credentials: 'include'
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error);
                    showMessage('Account created! Please login.', false);
                    setTimeout(() => toggleMode(), 1500);
                } catch (err) {
                    showMessage(err.message);
                }
                return;
            }

            // LOGIN
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include'
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                
                currentUser = data.user;
                document.getElementById('userName').innerText = currentUser.name;
                authForm.style.display = 'none';
                dashboard.style.display = 'block';
                showMessage('Login successful!', false);
            } catch (err) {
                showMessage(err.message);
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST', credentials: 'include' });
            currentUser = null;
            authForm.style.display = 'block';
            dashboard.style.display = 'none';
            document.getElementById('emailField').value = '';
            document.getElementById('passwordField').value = '';
            document.getElementById('nameField').value = '';
            showMessage('Logged out', false);
        }

        // Check if already logged in
        async function checkSession() {
            try {
                const res = await fetch('/api/me', { credentials: 'include' });
                if (res.ok) {
                    const user = await res.json();
                    currentUser = user;
                    document.getElementById('userName').innerText = user.name;
                    authForm.style.display = 'none';
                    dashboard.style.display = 'block';
                }
            } catch(e) {}
        }

        submitBtn.onclick = handleAuth;
        toggleLink.onclick = toggleMode;
        document.getElementById('logoutBtn').onclick = logout;

        checkSession();
    </script>
</body>
</html>
