<!DOCTYPE html>
<html>
<head><title>Register Test</title></head>
<body>
  <h2>Registration Test</h2>
  <input type="text" id="name" placeholder="Name"><br>
  <input type="email" id="email" placeholder="Email"><br>
  <input type="password" id="password" placeholder="Password"><br>
  <label><input type="checkbox" id="terms"> Accept Terms</label><br>
  <button onclick="register()">Create Account</button>
  <pre id="result"></pre>

  <script>
    async function register() {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const terms = document.getElementById('terms').checked;
      if (!name || !email || !password) {
        document.getElementById('result').innerText = 'Please fill all fields';
        return;
      }
      if (password.length < 8) {
        document.getElementById('result').innerText = 'Password must be at least 8 characters';
        return;
      }
      if (!terms) {
        document.getElementById('result').innerText = 'You must accept the terms';
        return;
      }
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ name, email, password, accepted_terms: true }),
          credentials: 'include'
        });
        const data = await res.json();
        document.getElementById('result').innerText = JSON.stringify(data, null, 2);
        if (res.ok) alert('Account created! Now try to login.');
      } catch(e) {
        document.getElementById('result').innerText = 'Error: ' + e.message;
      }
    }
  </script>
</body>
</html>
