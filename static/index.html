<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SmartSpend — AI-Powered Personal Finance</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ====== All existing CSS from your original ====== */
        /* (For brevity I include only critical additions; use your full CSS) */
        :root{ --bg: #080d14; --bg2: #0d1520; --bg3: #111c2b; --panel: rgba(15,30,48,0.7); --border: rgba(0,210,130,.12); --border2: rgba(255,255,255,.05); --green: #00d282; --green2: #00ff9d; --green-dim: rgba(0,210,130,.12); --red: #ff4d6d; --red-dim: rgba(255,77,109,.1); --amber: #f0a500; --amber-dim: rgba(240,165,0,.1); --blue: #3b82f6; --blue-dim: rgba(59,130,246,.1); --purple: #a855f7; --text: #e2eff8; --muted: #5a7a94; --mono: 'JetBrains Mono', monospace; --sans: 'Space Grotesk', sans-serif; --r: 16px; --r2: 10px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        body::before { content: ''; position: fixed; inset: 0; background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0,210,130,.05) 0%, transparent 60%), linear-gradient(rgba(0,210,130,.01) 1px, transparent 1px), linear-gradient(90deg, rgba(0,210,130,.01) 1px, transparent 1px); background-size: 100% 100%, 40px 40px, 40px 40px; pointer-events: none; z-index: 0; }
        /* Sidebar, main, panels – keep exactly as in your original, no changes */
        /* ... (your full CSS) ... */
        .feedback-buttons { margin-top: 8px; display: flex; gap: 8px; }
        .feedback-btn { background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 0.7rem; cursor: pointer; transition: 0.2s; }
        .feedback-btn:hover { background: var(--green-dim); color: var(--green); }
        /* Chatbot styles (same as previous) */
        .chat-button { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; border-radius: 30px; background: linear-gradient(135deg, var(--green), var(--green2)); box-shadow: 0 4px 12px rgba(0,210,130,0.4); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10001; }
        .chat-window { position: fixed; bottom: 100px; right: 24px; width: 380px; max-width: calc(100vw - 48px); height: 500px; background: var(--bg2); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; z-index: 10001; }
        .hidden { display: none; }
        /* ... rest of chat styles ... */
    </style>
</head>
<body>
    <!-- Your complete sidebar and main content (same as before) -->
    <!-- IMPORTANT: Transaction table now has 5 columns (no delete button) -->
    <!-- Advice items will now show 👍/👎 feedback buttons -->

    <div id="chatButton" class="chat-button">🧠</div>
    <div id="chatWindow" class="chat-window hidden">...</div>

    <script>
        // ========== FULL JAVASCRIPT with chatbot & feedback ==========
        // (I include only new functions; merge with your existing)
        
        async function giveFeedback(category, adviceText, helpful) {
            try {
                await apiFetch('/api/advice_feedback', {
                    method: 'POST',
                    body: JSON.stringify({ category, advice_text: adviceText, helpful })
                });
                toast('Thanks! ML will learn from this.');
            } catch(e) { toast('Feedback failed'); }
        }

        // Override the advice rendering to include feedback buttons
        function renderAdvice(adviceList) {
            const container = document.getElementById('adviceList');
            if (!container) return;
            container.innerHTML = adviceList.map(a => `
                <div class="advice-item">
                    <div style="flex:1">
                        <strong>${a.cat}</strong><br>
                        <span style="font-size:0.75rem;color:var(--muted)">${a.msg}</span>
                        <div class="feedback-buttons">
                            <button class="feedback-btn" onclick="giveFeedback('${a.cat}', '${a.msg.replace(/'/g, "\\'")}', true)">👍 Helpful</button>
                            <button class="feedback-btn" onclick="giveFeedback('${a.cat}', '${a.msg.replace(/'/g, "\\'")}', false)">👎 Not helpful</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Modify loadDashboard to use renderAdvice
        // Also store prediction for chatbot etc.
        // (rest of your existing JS remains same, just replace the advice rendering line)
    </script>
</body>
</html>
